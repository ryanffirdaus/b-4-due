name: b4due
description: "Pengingat tagihan & langganan, offline tanpa izin internet."
publish_to: 'none'

version: 0.2.0+3

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Storage
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Reminders
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  workmanager: ^0.10.10

  # Platform features
  local_auth: ^3.0.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  eventide: ^2.4.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7
  csv: ^8.0.0
  meta: ^1.19.0
  collection: ^1.19.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  mocktail: ^1.0.5

hooks:
  user_defines:
    sqlite3:
      # Android compiles SQLite from the vendored, public-domain amalgamation so
      # release builds never download prebuilt binaries (required by F-Droid).
      # Other targets, including `flutter test` on the host, use the package's
      # verified prebuilt binaries.
      source:
        android: source
        default: sqlite3
      path: third_party/sqlite3/sqlite3.c

flutter:
  generate: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora-ExtraBold.ttf
          weight: 800
    - family: RemixIcon
      fonts:
        - asset: assets/fonts/RemixIcon.ttf
