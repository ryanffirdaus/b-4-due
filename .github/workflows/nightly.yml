name: Nightly

# After CI passes on main, publishes a signed pre-release "X.Y.Z-nightly.N"
# (the next patch version, N = commit count) so test phones can update
# automatically, e.g. with Obtainium. Uses the same signing key as official
# releases; releases/latest keeps pointing at the last official release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # the commit count is the Android versionCode

      - name: Version
        run: |
          version=$(sed -n 's/^version: \([0-9]*\)\.\([0-9]*\)\.\([0-9]*\).*/\1.\2.\3/p' pubspec.yaml)
          IFS=. read -r major minor patch <<< "$version"
          count=$(git rev-list --count HEAD)
          # Sorts above the release it follows and below the next one.
          name="$major.$minor.$((patch + 1))-nightly.$count"
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$count" >> "$GITHUB_ENV"
          echo "Nightly $name (versionCode base $count)"

      # The keystore lives only in GitHub Secrets (base64), never in the repo.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.B4DUE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Signing secrets are missing; refusing to publish a debug-signed APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "B4DUE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build signed APKs
        env:
          B4DUE_KEYSTORE_PASSWORD: ${{ secrets.B4DUE_KEYSTORE_PASSWORD }}
          B4DUE_KEY_ALIAS: ${{ secrets.B4DUE_KEY_ALIAS }}
          B4DUE_KEY_PASSWORD: ${{ secrets.B4DUE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name="$NAME" --build-number="$BUILD_NUMBER"
          flutter build apk --release --build-name="$NAME" --build-number="$BUILD_NUMBER"
          mkdir dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk" "dist/b4due-$NAME-arm64-v8a.apk"
          cp "$out/app-release.apk"           "dist/b4due-$NAME-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Audit permissions (allowlist only)
        run: bash tool/check_apk_permissions.sh dist/*.apk

      - name: Publish pre-release and keep the last three nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "Build otomatis dari \`main\` ($SHA). Untuk pengujian; bisa berisi bug."
            echo "Automatic build from \`main\`. For testing; may contain bugs."
            echo
            echo "Pasang **arm64-v8a** untuk hampir semua HP modern; jika ragu, **universal**."
            echo
            git log -1 --format='Commit: %s' "$SHA"
          } > notes.md
          gh release create "$NAME" dist/*.apk dist/SHA256SUMS.txt \
            --prerelease --latest=false --target "$SHA" \
            --title "B4Due $NAME" --notes-file notes.md
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | contains("-nightly."))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
