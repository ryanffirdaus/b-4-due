name: Release

# Builds signed APKs for a semver tag vX.Y.Z and attaches them to its GitHub
# release. Normally called by release-please.yml after a release PR is merged;
# a tag pushed by hand or a manual run works too.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag is semver and matches pubspec version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not a semantic version (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "v$version" != "$TAG" ]]; then
            echo "Tag $TAG does not match pubspec version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The keystore lives only in GitHub Secrets (base64), never in the repo.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.B4DUE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Signing secrets are missing; refusing to publish a debug-signed APK." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "B4DUE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      - name: Build signed APKs
        env:
          B4DUE_KEYSTORE_PASSWORD: ${{ secrets.B4DUE_KEYSTORE_PASSWORD }}
          B4DUE_KEY_ALIAS: ${{ secrets.B4DUE_KEY_ALIAS }}
          B4DUE_KEY_PASSWORD: ${{ secrets.B4DUE_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk"   "dist/b4due-$VERSION-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/b4due-$VERSION-armeabi-v7a.apk"
          cp "$out/app-x86_64-release.apk"      "dist/b4due-$VERSION-x86_64.apk"
          cp "$out/app-release.apk"             "dist/b4due-$VERSION-universal.apk"

      - name: Audit permissions (allowlist only)
        run: tool/check_apk_permissions.sh dist/*.apk

      - name: Verify signatures and write checksums
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "dist/b4due-$VERSION-universal.apk" | tee signing-cert.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Pilih **arm64-v8a** untuk hampir semua HP Android modern. Jika ragu, pakai **universal**."
            echo "Choose **arm64-v8a** for almost every modern Android phone. If unsure, use **universal**."
            echo
            echo "Sertifikat penanda tangan / Signing certificate:"
            echo '```'
            grep -E 'SHA-256' signing-cert.txt
            echo '```'
            echo
            echo "Checksums: SHA256SUMS.txt"
          } > notes.md
          # release-please already created the release with the changelog;
          # append the download notes. A hand-pushed tag gets a new release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release view "$TAG" --json body --jq .body > body.md
            { cat body.md; echo; echo "---"; echo; cat notes.md; } > full.md
            gh release edit "$TAG" --notes-file full.md
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "B4Due $VERSION" --notes-file notes.md
          fi
